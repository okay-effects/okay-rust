[package]
name = "okay-rust"
version = "0.1.0"
edition = "2024"
description = "okay in Rust: effects as one API over async/await (okay::typed, okay::host, okay::dynamic) — handlers chosen by the context, interceptors for control and audit; okay-core's kernel as its specification"
license = "Apache-2.0"
repository = "https://github.com/okay-effects/okay-rust"

[lib]
name = "okay"

[dependencies]
# optional: none by default. `mimalloc` makes mimalloc the global allocator of the binary okay is linked into
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
mimalloc = ["dep:mimalloc"]
# benches only: count the allocations of one run of each lane (the system allocator under a counter)
count-allocs = []

[workspace]
members = ["examples/shop"]

[[bench]]
name = "kernel"
harness = false

[profile.release]
codegen-units = 1
lto = true
