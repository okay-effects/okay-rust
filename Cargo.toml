[package]
name = "okay-rust"
version = "0.1.0"
edition = "2024"
description = "okay in Rust: effects as one API over async/await (okay::typed, okay::host) — handlers chosen by the context, interceptors for control and audit; its specification the okay-machine crate"
license = "Apache-2.0"
repository = "https://github.com/okay-effects/okay-rust"
readme = "README.md"
keywords = ["effects", "algebraic-effects", "handlers", "async", "audit"]
categories = ["rust-patterns", "asynchronous"]
exclude = ["examples/okayhost", "scripts", "specs"]

[lib]
name = "okay"

[dependencies]
# optional: none by default. `mimalloc` makes mimalloc the global allocator of the binary okay is linked into
mimalloc = { version = "0.1", optional = true, default-features = false }

[features]
mimalloc = ["dep:mimalloc"]

[workspace]
members = ["machine", "examples/shop"]

[profile.release]
codegen-units = 1
lto = true
